<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La descente de gradient, vue en coupe</title>
<desc>Une vallée (courbe en U) représente l'erreur du modèle en fonction de ses réglages : haut sur les versants (mauvais modèles), bas dans le creux (bon modèle). Une bille, lâchée au hasard sur le versant gauche, descend pas à pas vers le fond, où l'erreur est minimale — c'est le meilleur modèle.</desc>
<defs>
<marker id="arrStep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5b5249" stroke-width="1.7"/></marker>
</defs>

<rect x="0" y="0" width="660" height="380" rx="14" fill="#efe7d3" stroke="#d9cbac"/>

<!-- axes -->
<g stroke="#b8a888" stroke-width="1.6">
<line x1="72" y1="60" x2="72" y2="335"/>
<line x1="72" y1="335" x2="628" y2="335"/>
</g>
<text x="34" y="195" font-size="15" fill="#3a3531" text-anchor="middle" transform="rotate(-90 34 195)">erreur</text>
<text x="360" y="363" font-size="15" fill="#3a3531" text-anchor="middle">les réglages du modèle (m, b)</text>

<!-- la vallée : erreur en fonction des réglages -->
<path d="M 110 105 Q 369 490 628 105" fill="none" stroke="#9a5b33" stroke-width="3"/>

<!-- la descente : pas successifs vers le creux -->
<g stroke="#5b5249" stroke-width="1.8" fill="none" stroke-dasharray="5 3">
<line x1="183" y1="197" x2="227" y2="239" marker-end="url(#arrStep)"/>
<line x1="243" y1="252" x2="287" y2="278" marker-end="url(#arrStep)"/>
<line x1="303" y1="286" x2="340" y2="294" marker-end="url(#arrStep)"/>
</g>

<!-- bille de départ (au hasard) -->
<circle cx="175" cy="189.5" r="8" fill="#efe7d3" stroke="#2f6f6a" stroke-width="2.2"/>
<!-- bille arrivée (meilleur modèle) -->
<circle cx="369" cy="297.5" r="8" fill="#2f6f6a" stroke="#efe7d3" stroke-width="1.5"/>

<!-- labels (chacun dans une zone libre, vérifiée sur toute la largeur du texte) -->
<text x="120" y="232" font-size="13" fill="#5b5249" text-anchor="middle">départ</text>
<line x1="148" y1="224" x2="166" y2="200" stroke="#5b5249" stroke-width="1.3" marker-end="url(#arrStep)"/>
<text x="369" y="323" font-size="13" fill="#3a3531" text-anchor="middle" font-weight="600">meilleur modèle</text>
</svg>
