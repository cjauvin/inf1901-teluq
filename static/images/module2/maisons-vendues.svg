<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Les mêmes maisons, mais la réponse est maintenant une catégorie</title>
<desc>Le même nuage de points : chaque maison est placée selon sa superficie (axe horizontal) et son prix (axe vertical). Cette fois, ce n'est plus la hauteur du point qu'on cherche à prédire, mais sa couleur : en bleu les maisons vendues en moins de 30 jours, en rouge celles qui ont traîné. Les maisons peu chères pour leur superficie (sous la tendance générale) partent vite ; les plus chères pour ce qu'elles offrent traînent — avec trois exceptions.</desc>

<rect x="0" y="0" width="660" height="500" rx="14" fill="#efe7d3" stroke="#d9cbac"/>

<g stroke="#e0d4b8" stroke-width="1">
<line x1="80" y1="351.7" x2="630" y2="351.7"/>
<line x1="80" y1="238.3" x2="630" y2="238.3"/>
<line x1="80" y1="125" x2="630" y2="125"/>
</g>

<g stroke="#b8a888" stroke-width="1.6">
<line x1="80" y1="40" x2="80" y2="380"/>
<line x1="80" y1="380" x2="630" y2="380"/>
</g>

<g stroke="#b8a888" stroke-width="1.4">
<line x1="80" y1="380" x2="80" y2="386"/>
<line x1="224.7" y1="380" x2="224.7" y2="386"/>
<line x1="369.5" y1="380" x2="369.5" y2="386"/>
<line x1="514.2" y1="380" x2="514.2" y2="386"/>
</g>
<g font-size="13" fill="#5b5249" text-anchor="middle">
<text x="80" y="402">100</text>
<text x="224.7" y="402">150</text>
<text x="369.5" y="402">200</text>
<text x="514.2" y="402">250</text>
<text x="355" y="430" font-size="15" fill="#3a3531">superficie (m²)</text>
</g>

<g stroke="#b8a888" stroke-width="1.4">
<line x1="74" y1="351.7" x2="80" y2="351.7"/>
<line x1="74" y1="238.3" x2="80" y2="238.3"/>
<line x1="74" y1="125" x2="80" y2="125"/>
</g>
<g font-size="13" fill="#5b5249" text-anchor="end">
<text x="68" y="356">300 k$</text>
<text x="68" y="242.8">500 k$</text>
<text x="68" y="129.5">700 k$</text>
</g>
<text x="18" y="210" font-size="15" fill="#3a3531" text-anchor="middle" transform="rotate(-90 18 210)">prix de vente</text>
<g fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.5">
<circle cx="114.7" cy="365.9" r="7"/>
<circle cx="137.9" cy="351.7" r="7"/>
<circle cx="195.8" cy="326.2" r="7"/>
<circle cx="253.6" cy="297.8" r="7"/>
<circle cx="282.6" cy="280.8" r="7"/>
<circle cx="311.5" cy="283.7" r="7"/>
<circle cx="357.8" cy="187.3" r="7"/>
<circle cx="392.6" cy="229.8" r="7"/>
<circle cx="427.3" cy="192.9" r="7"/>
<circle cx="462.0" cy="194.1" r="7"/>
<circle cx="508.3" cy="172.0" r="7"/>
<circle cx="554.6" cy="160.1" r="7"/>
</g>
<g fill="#c4564a" stroke="#efe7d3" stroke-width="1.5">
<circle cx="155.2" cy="272.3" r="7"/>
<circle cx="166.8" cy="346.0" r="7"/>
<circle cx="224.7" cy="323.3" r="7"/>
<circle cx="242.1" cy="227.0" r="7"/>
<circle cx="299.9" cy="198.6" r="7"/>
<circle cx="334.7" cy="161.8" r="7"/>
<circle cx="444.6" cy="122.1" r="7"/>
<circle cx="531.5" cy="72.7" r="7"/>
</g>
<circle cx="176" cy="458" r="7" fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.5"/>
<text x="192" y="462" font-size="14" fill="#3a3531" text-anchor="start">vendue en moins de 30 jours</text>
<circle cx="412" cy="458" r="7" fill="#c4564a" stroke="#efe7d3" stroke-width="1.5"/>
<text x="428" y="462" font-size="14" fill="#3a3531" text-anchor="start">a traîné</text>
</svg>
