<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>La réponse comme troisième dimension, à deux valeurs</title>
<desc>Une vue en perspective. Le plan horizontal porte les deux mêmes axes qu'auparavant : la superficie et l'année de construction. La réponse à la question « vendue en moins de 30 jours ? » occupe un troisième axe, vertical — mais un axe qui ne comporte que deux niveaux : 0 pour non, en bas, et 1 pour oui, en haut. Chaque maison se pose donc sur l'un ou l'autre de deux plans superposés. Vu d'en haut, ce dessin redonne exactement le nuage où la réponse était codée par une couleur.</desc>
<rect x="0" y="0" width="700" height="470" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<polygon points="150.0,348.0 400.0,400.0 504.0,316.0 254.0,264.0" fill="rgba(196,86,74,0.07)" stroke="#cbbd9c" stroke-width="1.5"/>
<g fill="#c4564a" stroke="#efe7d3" stroke-width="1.4">
<circle cx="203.2" cy="331.8" r="6.5"/>
<circle cx="206.2" cy="342.7" r="6.5"/>
<circle cx="246.0" cy="337.3" r="6.5"/>
<circle cx="238.1" cy="354.4" r="6.5"/>
<circle cx="290.3" cy="336.3" r="6.5"/>
<circle cx="300.8" cy="357.2" r="6.5"/>
<circle cx="392.5" cy="328.6" r="6.5"/>
<circle cx="356.7" cy="384.2" r="6.5"/>
</g>
<line x1="150.0" y1="348.0" x2="150.0" y2="154.0" stroke="#8a7d6e" stroke-width="1.8"/>
<line x1="143.0" y1="348.0" x2="150.0" y2="348.0" stroke="#8a7d6e" stroke-width="1.6"/>
<text x="136.0" y="353.0" font-size="15" fill="#3a3531" text-anchor="end" font-weight="700">0</text>
<text x="136.0" y="370.0" font-size="11.5" fill="#7a6f63" text-anchor="end">(non)</text>
<line x1="143.0" y1="180.0" x2="150.0" y2="180.0" stroke="#8a7d6e" stroke-width="1.6"/>
<text x="136.0" y="185.0" font-size="15" fill="#3a3531" text-anchor="end" font-weight="700">1</text>
<text x="136.0" y="202.0" font-size="11.5" fill="#7a6f63" text-anchor="end">(oui)</text>
<text x="76.0" y="136.0" font-size="13.5" fill="#3a3531" text-anchor="middle" font-weight="600">vendue vite ?</text>
<text x="76.0" y="153.0" font-size="11.5" fill="#7a6f63" text-anchor="middle" font-style="italic">deux niveaux seulement</text>
<polygon points="150.0,180.0 400.0,232.0 504.0,148.0 254.0,96.0" fill="rgba(58,110,165,0.07)" stroke="#cbbd9c" stroke-width="1.5"/>
<g fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.4">
<circle cx="185.9" cy="167.0" r="6.5"/>
<circle cx="289.1" cy="123.8" r="6.5"/>
<circle cx="299.9" cy="149.8" r="6.5"/>
<circle cx="310.6" cy="157.2" r="6.5"/>
<circle cx="359.0" cy="131.5" r="6.5"/>
<circle cx="342.4" cy="168.9" r="6.5"/>
<circle cx="364.7" cy="161.6" r="6.5"/>
<circle cx="388.4" cy="147.8" r="6.5"/>
<circle cx="402.3" cy="166.0" r="6.5"/>
<circle cx="458.8" cy="147.1" r="6.5"/>
<circle cx="433.3" cy="181.0" r="6.5"/>
<circle cx="474.1" cy="158.8" r="6.5"/>
</g>
<text x="266.0" y="408.0" font-size="13.5" fill="#3a3531" text-anchor="middle" transform="rotate(11.7 266.0 408.0)">superficie</text>
<text x="195.2" y="288.8" font-size="13.5" fill="#3a3531" text-anchor="middle" transform="rotate(-38.9 195.2 288.8)">année</text>
<text x="350" y="446" font-size="13" fill="#5b5249" text-anchor="middle">La réponse a bel et bien son propre axe — mais un axe qui ne compte que deux barreaux.</text>
</svg>
