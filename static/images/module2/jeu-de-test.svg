<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Découpage entraînement / test</title>
<desc>L'ensemble des données est scindé en deux : un grand bloc d'entraînement (environ quatre cinquièmes) sur lequel le modèle apprend, et un petit bloc de test (environ un cinquième), mis de côté et jamais vu pendant l'entraînement, qui sert à mesurer la généralisation.</desc>
<rect x="0" y="0" width="660" height="300" rx="14" fill="#efe7d3" stroke="#d9cbac"/>
<text x="330" y="40" font-size="16" fill="#3a3531" text-anchor="middle" font-weight="600">On scinde les données avant d'entraîner</text>
<rect x="40" y="70" width="395" height="150" rx="11" fill="#2f6f6a" fill-opacity="0.07" stroke="#b8a888" stroke-width="1.4"/>
<g fill="#2f6f6a" stroke="#efe7d3" stroke-width="1.3">
<circle cx="78.0" cy="108.0" r="7"/>
<circle cx="124.0" cy="108.0" r="7"/>
<circle cx="170.0" cy="108.0" r="7"/>
<circle cx="216.0" cy="108.0" r="7"/>
<circle cx="262.0" cy="108.0" r="7"/>
<circle cx="308.0" cy="108.0" r="7"/>
<circle cx="354.0" cy="108.0" r="7"/>
<circle cx="400.0" cy="108.0" r="7"/>
<circle cx="78.0" cy="140.0" r="7"/>
<circle cx="124.0" cy="140.0" r="7"/>
<circle cx="170.0" cy="140.0" r="7"/>
<circle cx="216.0" cy="140.0" r="7"/>
<circle cx="262.0" cy="140.0" r="7"/>
<circle cx="308.0" cy="140.0" r="7"/>
<circle cx="354.0" cy="140.0" r="7"/>
<circle cx="400.0" cy="140.0" r="7"/>
<circle cx="78.0" cy="172.0" r="7"/>
<circle cx="124.0" cy="172.0" r="7"/>
<circle cx="170.0" cy="172.0" r="7"/>
<circle cx="216.0" cy="172.0" r="7"/>
<circle cx="262.0" cy="172.0" r="7"/>
<circle cx="308.0" cy="172.0" r="7"/>
<circle cx="354.0" cy="172.0" r="7"/>
<circle cx="400.0" cy="172.0" r="7"/>
<circle cx="78.0" cy="204.0" r="7"/>
<circle cx="124.0" cy="204.0" r="7"/>
<circle cx="170.0" cy="204.0" r="7"/>
<circle cx="216.0" cy="204.0" r="7"/>
<circle cx="262.0" cy="204.0" r="7"/>
<circle cx="308.0" cy="204.0" r="7"/>
<circle cx="354.0" cy="204.0" r="7"/>
<circle cx="400.0" cy="204.0" r="7"/>
</g>
<text x="237" y="93" font-size="12.5" fill="#5b5249" text-anchor="middle">≈ 4 cinquièmes</text>
<text x="237" y="244" font-size="15" fill="#2f6f6a" text-anchor="middle" font-weight="600">ensemble d'entraînement</text>
<text x="237" y="264" font-size="12.5" fill="#7a6f63" text-anchor="middle">le modèle apprend ici</text>
<rect x="475" y="70" width="145" height="150" rx="11" fill="#9a5b33" fill-opacity="0.08" stroke="#9a5b33" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.95"/>
<g fill="#9a5b33" stroke="#efe7d3" stroke-width="1.3">
<circle cx="525.0" cy="108.0" r="7"/>
<circle cx="595.0" cy="108.0" r="7"/>
<circle cx="525.0" cy="140.0" r="7"/>
<circle cx="595.0" cy="140.0" r="7"/>
<circle cx="525.0" cy="172.0" r="7"/>
<circle cx="595.0" cy="172.0" r="7"/>
<circle cx="525.0" cy="204.0" r="7"/>
<circle cx="595.0" cy="204.0" r="7"/>
</g>
<text x="547" y="93" font-size="12.5" fill="#5b5249" text-anchor="middle">≈ 1 cinquième</text>
<text x="547" y="244" font-size="15" fill="#9a5b33" text-anchor="middle" font-weight="600">ensemble de test</text>
<text x="547" y="264" font-size="12.5" fill="#7a6f63" text-anchor="middle">gardé sous scellés</text>
</svg>