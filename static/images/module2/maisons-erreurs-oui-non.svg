<!-- légende -->
<circle cx="147" cy="452" r="7" fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.5"/>
<text x="163" y="456" font-size="14" fill="#3a3531" text-anchor="start">prédiction du modèle : « oui », vendue en moins de 30 jours</text>
<circle cx="238" cy="478" r="7" fill="#3a6ea5" stroke="#efe7d3" stroke-width="1.5"/>
